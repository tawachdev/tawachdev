<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Open source roadmap. Coming soon to this profile: ForgeShield, security and recon toolkit. Stadium Pro, booking SaaS platform. Tawach SaaS Engine, product starter kit. More open source lands here first.">
  <style>
    svg { --glass: rgba(255,255,255,0.60); --glass-line: rgba(15,23,42,0.12); --inner: rgba(15,23,42,0.04); --inner-line: rgba(15,23,42,0.08); --strong: #0F1B2D; --muted: #64748B; --blue: #0284C7; --amber: #B45309; --green: #16A34A; }
    @media (prefers-color-scheme: dark) { svg { --glass: rgba(9,17,32,0.55); --glass-line: rgba(148,163,184,0.16); --inner: rgba(255,255,255,0.03); --inner-line: rgba(148,163,184,0.12); --strong: #E5EDF5; --muted: #8B98A9; --blue: #38BDF8; --amber: #FBBF24; --green: #22C55E; } }
    .panel { fill: var(--glass); stroke: var(--glass-line); stroke-width: 1.5; }
    .inner { fill: var(--inner); stroke: var(--inner-line); stroke-width: 1; }
    .title { fill: var(--strong); } .muted { fill: var(--muted); }
    .blue { fill: var(--blue); } .amber { fill: var(--amber); } .green { fill: var(--green); }
    .chip { fill: var(--amber); fill-opacity: 0.14; stroke: var(--amber); stroke-opacity: 0.55; }
  </style>

  <rect x="20" y="20" width="1160" height="268" rx="16" class="panel"/>

  <text x="60" y="64" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" class="blue" letter-spacing="1">OPEN SOURCE ROADMAP</text>
  <circle cx="1044" cy="57" r="5" class="green"/>
  <text x="1056" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" class="green">ACTIVE</text>

  <rect x="44" y="84" width="1112" height="56" rx="12" class="inner"/>
  <text x="68" y="107" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" class="title">ForgeShield <tspan class="muted" font-weight="500">— security &amp; recon toolkit</tspan></text>
  <rect x="988" y="99" width="144" height="26" rx="13" class="chip"/>
  <text x="1060" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" class="amber">COMING SOON</text>

  <rect x="44" y="148" width="1112" height="56" rx="12" class="inner"/>
  <text x="68" y="171" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" class="title">Stadium Pro <tspan class="muted" font-weight="500">— booking SaaS platform</tspan></text>
  <rect x="988" y="163" width="144" height="26" rx="13" class="chip"/>
  <text x="1060" y="181" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" class="amber">COMING SOON</text>

  <rect x="44" y="212" width="1112" height="56" rx="12" class="inner"/>
  <text x="68" y="235" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" class="title">Tawach SaaS Engine <tspan class="muted" font-weight="500">— product starter kit</tspan></text>
  <rect x="988" y="227" width="144" height="26" rx="13" class="chip"/>
  <text x="1060" y="245" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" class="amber">COMING SOON</text>
</svg>
