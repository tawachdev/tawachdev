    .panel { fill: var(--glass); stroke: var(--glass-line); stroke-width: 1.5; }
    .inner { fill: var(--inner); stroke: var(--inner-line); stroke-width: 1; }
    .strong { fill: var(--strong); } .body { fill: var(--body); } .muted { fill: var(--muted); }
    .blue { fill: var(--blue); } .amber { fill: var(--amber); } .purple { fill: var(--purple); } .green { fill: var(--green); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
