<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Track record: over 40 shipped repositories. AI and developer tooling: Forgelens, Forgepilot, ForgeShield, ForgeShield-Lab-OS, ForgeRadar, ForgeSense, Atlas Nexus. Systems and games: CodeBop, MZKNI, MiniCraft, mini-doom. Most work lives in private client repos.">
  <style>
    svg { --glass: rgba(255,255,255,0.60); --glass-line: rgba(15,23,42,0.12); --inner: rgba(15,23,42,0.04); --inner-line: rgba(15,23,42,0.08); --strong: #0F1B2D; --body: #33475C; --muted: #64748B; --blue: #0284C7; --purple: #7C3AED; --green: #16A34A; }
    @media (prefers-color-scheme: dark) { svg { --glass: rgba(9,17,32,0.55); --glass-line: rgba(148,163,184,0.16); --inner: rgba(255,255,255,0.03); --inner-line: rgba(148,163,184,0.12); --strong: #E5EDF5; --body: #C9D4E0; --muted: #8B98A9; --blue: #38BDF8; --purple: #A78BFA; --green: #22C55E; } }
    .panel { fill: var(--glass); stroke: var(--glass-line); stroke-width: 1.5; }
    .inner { fill: var(--inner); stroke: var(--inner-line); stroke-width: 1; }
    .muted { fill: var(--muted); } .body { fill: var(--body); }
    .blue { fill: var(--blue); } .purple { fill: var(--purple); } .green { fill: var(--green); }
  </style>

  <rect x="20" y="20" width="1160" height="330" rx="16" class="panel"/>

