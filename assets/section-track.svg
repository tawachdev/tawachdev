<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Track record: over 40 shipped repositories. AI and developer tooling: Forgelens context engine, Forgepilot in Rust, ForgeShield and Lab-OS security tools, ForgeRadar, ForgeSense in C++, Atlas Nexus Python data platform. Products and SaaS: Stadium Pro booking SaaS, Smart Cafe OS, Diyafa OS, Invoicely, Opscore, Islam Plus, Nada Perfume, Dr Kaoui, Jibha, L9itha, dber, menu-app. Systems and games: CodeBop in Rust, MZKNI in Swift for iOS, MiniCraft with Three.js, mini-doom, Rust booking calculator. Open-source repos are public and runnable, client work stays private.">
  <style>
